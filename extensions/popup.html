<!DOCTYPE html>
<html>

<head>

    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 12px;
